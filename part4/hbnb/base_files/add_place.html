<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Place</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <main>
        <form id="add-place-form">
            <h2>Add a Place</h2>

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>

            <label for="price">Price per night ($):</label>
            <input type="number" id="price" name="price" min="1" step="0.01" required>

            <label for="latitude">Latitude:</label>
            <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required>

            <label for="longitude">Longitude:</label>
            <input type="number" id="longitude" name="longitude" step="any" min="-180" max="180" required>

            <label for="photo">Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <img id="photo-preview" src="" alt="Preview" style="display:none; max-width:100%; border-radius:8px; margin-top:0.5rem;">

            <button type="submit">Add Place</button>
        </form>
    </main>
    <div id="footer"></div>
    <script src="scripts.js"></script>
</body>
</html>
