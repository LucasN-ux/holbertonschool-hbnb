<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modify your habitat registration on hbnb.">
    <title>Edit Habitat — hbnb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="header"></div>
    <main id="main-content">
        <div class="add-place-page">
            <h1 class="page-title">Edit habitat</h1>

            <form id="edit-place-form" novalidate aria-label="Edit habitat form">

                <div class="form-section">
                    <h2 class="form-section-title">Habitat designation</h2>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="title">Station name</label>
                            <input type="text" id="title" name="title" autocomplete="off" required aria-required="true">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="description">Atmospheric briefing</label>
                            <textarea id="description" name="description" required aria-required="true"></textarea>
                        </div>
                    </div>
                    <div class="form-row two-cols">
                        <div class="form-field">
                            <label for="price">Rate per cycle ($)</label>
                            <input type="number" id="price" name="price" min="1" step="0.01" required aria-required="true">
                        </div>
                        <div class="form-field">
                            <label for="latitude">Orbital latitude</label>
                            <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required aria-required="true">
                        </div>
                        <div class="form-field">
                            <label for="longitude">Orbital longitude</label>
                            <input type="number" id="longitude" name="longitude" step="any" min="-180" max="180" required aria-required="true">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title">On-board systems</h2>
                    <div id="amenities-list" class="amenities-grid" role="group" aria-label="Select on-board systems">
                        <p class="loading-text">Scanning available systems…</p>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title">Visual scans</h2>
                    <p class="form-section-desc" id="photos-count-hint">0 / 10 scans</p>
                    <div id="all-photo-previews" class="photo-previews-grid" aria-label="Visual scans"></div>
                    <label class="photo-upload-area" for="photos" id="photos-upload-label" style="margin-top:1rem;">
                        <span class="photo-upload-icon" aria-hidden="true">🛸</span>
                        <span class="photo-upload-text">Upload additional scans</span>
                        <span class="photo-upload-hint">PNG, JPG, WEBP — 10 scans maximum</span>
                        <input type="file" id="photos" name="photos" accept="image/*" multiple style="display:none;" aria-describedby="photos-count-hint">
                    </label>
                </div>

                <div class="form-submit-row">
                    <button type="submit" class="btn-save">Sync changes</button>
                </div>

            </form>
        </div>
    </main>
    <div id="footer"></div>
    <script src="scripts.js"></script>
</body>
</html>
