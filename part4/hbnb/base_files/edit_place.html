<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Place</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <main>
        <div class="add-place-page">
            <h1 class="page-title">Edit my place</h1>

            <form id="edit-place-form">

                <div class="form-section">
                    <h3 class="form-section-title">Basic information</h3>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" required></textarea>
                        </div>
                    </div>
                    <div class="form-row two-cols">
                        <div class="form-field">
                            <label for="price">Price per night ($)</label>
                            <input type="number" id="price" name="price" min="1" step="0.01" required>
                        </div>
                        <div class="form-field">
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" name="latitude" step="any" min="-90" max="90" required>
                        </div>
                        <div class="form-field">
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" name="longitude" step="any" min="-180" max="180" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="form-section-title">Amenities</h3>
                    <div id="amenities-list" class="amenities-grid">
                        <p class="loading-text">Loading amenities...</p>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="form-section-title">Photos</h3>
                    <div id="current-photos" class="photo-previews-grid"></div>
                    <p class="form-section-desc" style="margin-top:1rem;">Add new photos (replaces existing ones if selected)</p>
                    <label class="photo-upload-area" for="photos">
                        <span class="photo-upload-icon">📷</span>
                        <span class="photo-upload-text">Click to select photos</span>
                        <span class="photo-upload-hint">PNG, JPG, WEBP</span>
                        <input type="file" id="photos" name="photos" accept="image/*" multiple style="display:none;">
                    </label>
                    <div id="photo-previews" class="photo-previews-grid"></div>
                </div>

                <div class="form-submit-row">
                    <button type="submit" class="btn-save">Save changes</button>
                </div>

            </form>
        </div>
    </main>
    <div id="footer"></div>
    <script src="scripts.js"></script>
</body>
</html>
