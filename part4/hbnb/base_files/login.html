<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in or create an account on hbnb.">
    <title>Login — hbnb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="header"></div>
    <main id="main-content">
        <form id="login-form" novalidate aria-label="Login form">
            <h2>Welcome back</h2>
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
                aria-required="true"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
                aria-required="true"
            >

            <button type="submit">Login</button>
            <p>No account? <a href="#" id="show-register">Register here</a></p>
        </form>

        <form id="register-form" style="display:none;" novalidate aria-label="Registration form">
            <h2>Create an account</h2>
            <label for="first_name">First Name</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                autocomplete="given-name"
                placeholder="John"
                required
                aria-required="true"
            >

            <label for="last_name">Last Name</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                autocomplete="family-name"
                placeholder="Doe"
                required
                aria-required="true"
            >

            <label for="reg-email">Email address</label>
            <input
                type="email"
                id="reg-email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
                aria-required="true"
            >

            <label for="reg-password">Password</label>
            <input
                type="password"
                id="reg-password"
                name="password"
                autocomplete="new-password"
                placeholder="Choose a strong password"
                required
                aria-required="true"
                minlength="8"
            >

            <button type="submit">Register</button>
            <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
        </form>
    </main>
    <div id="footer"></div>
    <script src="scripts.js"></script>
</body>
</html>
